avatar:
  image:
    max-input-bytes: 5242880
    max-dimension: 6000
    max-pixels: 16000000
    output-size: 256
    max-output-bytes: 102400
    quality: 0.85
    max-concurrent: 2
spring:
  servlet:
    multipart:
      max-file-size: 5MB      # 单个文件上限
      max-request-size: 10MB  # 整个请求上限
  application:
    name: tripmate
  # session配置
  session:
    store-type: redis
    # session 30天过期
    timeout: 2592000
  profiles:
    active: dev
  # mysql
  datasource:
    driver-class-name: ${tripmate.datasource.driver-class-name}
    url: ${tripmate.datasource.url}
    username: ${tripmate.datasource.username}
    password: ${tripmate.datasource.password}
    hikari:
      connection-init-sql: "SET SESSION time_zone = '+08:00'"
  data:
    redis:
      host: ${tripmate.data.redis.host}
      port: ${tripmate.data.redis.port}
      password: ${tripmate.data.redis.password}
      ttl: ${tripmate.data.redis.ttl}
      database: 0
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
